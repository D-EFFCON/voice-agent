name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, test, build, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Build before test: the suite boots the built server from dist/ (test/helpers/spawnServer.ts).
      - run: pnpm build
      - run: pnpm test
      - run: pnpm docs:env --check

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Personal accounts need no key. A repository under a GitHub organisation needs the
          # free key from gitleaks.io stored as the GITLEAKS_LICENSE repository secret.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
